<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ESPN Master OBS Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .controls select {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            max-width: 260px;
        }

        .widget-card {
            width: 620px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.92));
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-top: 6px solid #00f2fe;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header-title {
            font-family: 'Teko', sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .header-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .back-btn {
            background: #1e293b;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            display: none;
        }

        .back-btn:hover {
            background: #00f2fe;
            color: #0f172a;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .content-area::-webkit-scrollbar { width: 0px; }

        .event-item {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-item:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.4);
        }

        .event-item.live {
            border-left: 4px solid #ff3b30;
        }

        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 36%;
        }

        .team.away {
            flex-direction: row-reverse;
            text-align: right;
        }

        .team-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rank-tag {
            font-size: 10px;
            font-weight: 800;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.4);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            line-height: 1;
        }

        .score-box {
            text-align: center;
            width: 28%;
        }

        .scores {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffcc00;
            line-height: 1;
        }

        .status-text {
            font-size: 9px;
            font-weight: 800;
            color: #00f2fe;
            text-transform: uppercase;
            margin-top: 2px;
            white-space: nowrap;
        }

        .goals-summary {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: #cbd5e1;
        }

        .goals-col { width: 48%; line-height: 1.3; }
        .goals-col.home { text-align: left; }
        .goals-col.away { text-align: right; }
        .goal-icon { color: #ffcc00; font-size: 10px; }

        .detail-view {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 10px 5px;
        }

        .detail-matchup {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .detail-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 38%;
            text-align: center;
        }

        .detail-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .detail-team-name {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 700;
            line-height: 0.95;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-record {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            margin-top: 4px;
        }

        .detail-center { text-align: center; width: 24%; }
        .detail-score { font-family: 'Teko', sans-serif; font-size: 40px; font-weight: 700; color: #ffcc00; line-height: 1; }
        .detail-status { font-size: 11px; font-weight: 800; color: #00f2fe; text-transform: uppercase; margin-top: 4px; }

        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 13px; font-weight: 700; color: #ffffff; }

        .news-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            display: block;
            transition: background 0.2s, border-color 0.2s;
        }

        .news-item:hover { background: rgba(0, 242, 254, 0.1); border-color: #00f2fe; }
        .news-title { font-size: 14px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .news-desc { font-size: 11px; color: #94a3b8; line-height: 1.3; }
        .no-data { text-align: center; padding: 20px; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="controls">
        <select id="league-select" onchange="loadESPNData()">
            <optgroup label="Fútbol Profesional (Con Goleadores)">
                <option value="soccer/esp.1">LaLiga EA Sports</option>
                <option value="soccer/eng.1">Premier League</option>
                <option value="soccer/uefa.champions">UEFA Champions League</option>
                <option value="soccer/uefa.europa">UEFA Europa League</option>
                <option value="soccer/ita.1">Serie A Italia</option>
                <option value="soccer/ger.1">Bundesliga Alemania</option>
                <option value="soccer/fra.1">Ligue 1 Francia</option>
                <option value="soccer/usa.1">MLS (EE. UU.)</option>
            </optgroup>
            <optgroup label="Baloncesto Profesional">
                <option value="basketball/nba">NBA</option>
                <option value="basketball/eur.1">Euroliga</option>
            </optgroup>
            <optgroup label="Deportes Universitarios (NCAA)">
                <option value="football/college-football">NCAA Fútbol Americano</option>
                <option value="basketball/mens-college-basketball">NCAA Baloncesto Masculino</option>
            </optgroup>
            <optgroup label="Otros Deportes">
                <option value="football/nfl">NFL</option>
                <option value="racing/f1">Fórmula 1</option>
            </optgroup>
        </select>

        <select id="view-type" onchange="loadESPNData()">
            <option value="scoreboard">Partidos / Marcadores</option>
            <option value="news">Noticias de Última Hora</option>
        </select>
    </div>

    <div class="widget-card">
        <div class="header">
            <button class="back-btn" id="back-btn" onclick="backToList()">← Volver</button>
            <div class="header-title" id="widget-title">PARTIDOS Y HORARIOS</div>
            <div class="header-badge" id="widget-badge">HORA DE ESPAÑA</div>
        </div>

        <div class="content-area" id="content-area">
            <div class="no-data">Cargando datos de ESPN...</div>
        </div>
    </div>

    <script>
        let currentEvents = [];

        function formatSpanishTime(dateString) {
            const date = new Date(dateString);
            const dayName = date.toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid', weekday: 'short' });
            const dayMonth = date.toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid', day: '2-digit', month: '2-digit' });
            const time = date.toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', hour12: false });
            const formattedDay = dayName.charAt(0).toUpperCase() + dayName.slice(1);
            return `${formattedDay} ${dayMonth} - ${time} ESP`;
        }

        function getRankBadge(teamObj) {
            if (teamObj && teamObj.curatedRank && teamObj.curatedRank.current && teamObj.curatedRank.current <= 25) {
                return `<span class="rank-tag">#${teamObj.curatedRank.current}</span>`;
            }
            return '';
        }

        function extractGoalscorers(competition, isSoccer) {
            if (!isSoccer || !competition.details) return { home: '', away: '' };

            let homeGoals = [];
            let awayGoals = [];

            competition.details.forEach(detail => {
                if (detail.type && (detail.type.id === '1' || detail.type.text === 'Goal' || detail.type.text === 'Score')) {
                    const scorer = detail.participants && detail.participants[0] ? detail.participants[0].athlete.displayName : 'Gol';
                    const clock = detail.clock ? detail.clock.displayValue : '';
                    const text = `${scorer} ${clock ? "("+clock+")" : ""}`;

                    if (detail.team && detail.team.id === competition.competitors[0].id) {
                        if (competition.competitors[0].homeAway === 'home') homeGoals.push(text);
                        else awayGoals.push(text);
                    } else if (detail.team && detail.team.id === competition.competitors[1].id) {
                        if (competition.competitors[1].homeAway === 'home') homeGoals.push(text);
                        else awayGoals.push(text);
                    }
                }
            });

            return {
                home: homeGoals.length > 0 ? homeGoals.join(', ') : '',
                away: awayGoals.length > 0 ? awayGoals.join(', ') : ''
            };
        }

        async function loadESPNData() {
            document.getElementById('back-btn').style.display = 'none';
            const league = document.getElementById('league-select').value;
            const view = document.getElementById('view-type').value;
            const container = document.getElementById('content-area');
            const titleEl = document.getElementById('widget-title');
            const badgeEl = document.getElementById('widget-badge');

            const isSoccer = league.startsWith('soccer/');
            const url = `https://site.api.espn.com/apis/site/v2/sports/${league}/${view}`;

            container.innerHTML = '<div class="no-data">Conectando con ESPN...</div>';

            try {
                // Petición directa optimizada para OBS
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error('Error en la respuesta de la red');
                const data = await res.json();

                if (view === 'scoreboard') {
                    titleEl.innerText = "PARTIDOS EN DIRECTO Y AGENDA";
                    badgeEl.innerText = "HORA DE ESPAÑA";

                    if (!data.events || data.events.length === 0) {
                        container.innerHTML = '<div class="no-data">NO HAY PARTIDOS PROGRAMADOS HOY</div>';
                        return;
                    }

                    currentEvents = data.events;
                    container.innerHTML = '';

                    currentEvents.forEach((event, index) => {
                        const competition = event.competitions[0];
                        const competitors = competition.competitors || [];
                        const homeTeam = competitors.find(t => t.homeAway === 'home') || competitors[0] || {};
                        const awayTeam = competitors.find(t => t.homeAway === 'away') || competitors[1] || {};

                        const state = event.status.type.state;
                        const isLive = state === 'in';
                        let statusText = event.status.type.detail;

                        if (state === 'pre' && event.date) {
                            statusText = formatSpanishTime(event.date);
                        } else if (state === 'post') {
                            statusText = 'FINALIZADO';
                        }

                        const homeLogo = (homeTeam.team && homeTeam.team.logo) || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';
                        const awayLogo = (awayTeam.team && awayTeam.team.logo) || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';

                        const homeName = homeTeam.team ? (homeTeam.team.abbreviation || homeTeam.team.shortDisplayName || homeTeam.team.name) : 'LOCAL';
                        const awayName = awayTeam.team ? (awayTeam.team.abbreviation || awayTeam.team.shortDisplayName || awayTeam.team.name) : 'VISITANTE';

                        const homeRank = getRankBadge(homeTeam);
                        const awayRank = getRankBadge(awayTeam);

                        const scoreDisplay = state === 'pre' ? 'VS' : `${homeTeam.score || '0'} - ${awayTeam.score || '0'}`;

                        const goals = (isSoccer && state !== 'pre') ? extractGoalscorers(competition, true) : { home: '', away: '' };
                        const hasGoals = goals.home || goals.away;

                        container.innerHTML += `
                            <div class="event-item ${isLive ? 'live' : ''}" onclick="showMatchDetail(${index})">
                                <div class="match-row">
                                    <div class="team home">
                                        <img class="team-logo" src="${homeLogo}" alt="">
                                        <span class="team-name">${homeRank} ${homeName}</span>
                                    </div>
                                    <div class="score-box">
                                        <div class="scores">${scoreDisplay}</div>
                                        <div class="status-text">${statusText}</div>
                                    </div>
                                    <div class="team away">
                                        <img class="team-logo" src="${awayLogo}" alt="">
                                        <span class="team-name">${awayName} ${awayRank}</span>
                                    </div>
                                </div>
                                ${hasGoals ? `
                                    <div class="goals-summary">
                                        <div class="goals-col home">${goals.home ? `<span class="goal-icon">⚽</span> ${goals.home}` : ''}</div>
                                        <div class="goals-col away">${goals.away ? `<span class="goal-icon">⚽</span> ${goals.away}` : ''}</div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });

                } else if (view === 'news') {
                    titleEl.innerText = "ÚLTIMA HORA ESPORTS";
                    badgeEl.innerText = "NOTICIAS OFICIALES";

                    if (!data.articles || data.articles.length === 0) {
                        container.innerHTML = '<div class="no-data">SIN NOTICIAS RECIENTES</div>';
                        return;
                    }

                    container.innerHTML = '';
                    data.articles.slice(0, 5).forEach(article => {
                        let articleUrl = '#';
                        if (article.links && article.links.web && article.links.web.href) {
                            articleUrl = article.links.web.href;
                        }

                        container.innerHTML += `
                            <a class="news-item" href="${articleUrl}" target="_blank">
                                <div class="news-title">${article.headline}</div>
                                <div class="news-desc">${article.description || ''}</div>
                            </a>
                        `;
                    });
                }

            } catch (err) {
                console.error("Error al conectar con ESPN:", err);
                container.innerHTML = '<div class="no-data">⚠️ Error de conexión. Comprueba que tu OBS tenga acceso a Internet o pulsa "Actualizar caché de esta fuente".</div>';
            }
        }

        function showMatchDetail(index) {
            const event = currentEvents[index];
            if (!event) return;

            const league = document.getElementById('league-select').value;
            const isSoccer = league.startsWith('soccer/');

            const competition = event.competitions[0];
            const competitors = competition.competitors || [];
            const homeTeam = competitors.find(t => t.homeAway === 'home') || competitors[0] || {};
            const awayTeam = competitors.find(t => t.homeAway === 'away') || competitors[1] || {};

            const state = event.status.type.state;
            let statusText = event.status.type.detail;
            if (state === 'pre' && event.date) {
                statusText = formatSpanishTime(event.date);
            } else if (state === 'post') {
                statusText = 'FINALIZADO';
            }

            const homeLogo = (homeTeam.team && homeTeam.team.logo) || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';
            const awayLogo = (awayTeam.team && awayTeam.team.logo) || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';

            const homeName = homeTeam.team ? homeTeam.team.displayName : 'Local';
            const awayName = awayTeam.team ? awayTeam.team.displayName : 'Visitante';

            const homeRank = getRankBadge(homeTeam);
            const awayRank = getRankBadge(awayTeam);

            const homeRecord = (homeTeam.records && homeTeam.records[0]) ? homeTeam.records[0].summary : 'N/D';
            const awayRecord = (awayTeam.records && awayTeam.records[0]) ? awayTeam.records[0].summary : 'N/D';

            const scoreDisplay = state === 'pre' ? 'VS' : `${homeTeam.score || '0'} - ${awayTeam.score || '0'}`;

            const venueName = (competition.venue && competition.venue.fullName) ? competition.venue.fullName : 'Por determinar';
            const venueCity = (competition.venue && competition.venue.address && competition.venue.address.city) ? `, ${competition.venue.address.city}` : '';
            const broadcast = (competition.broadcasts && competition.broadcasts[0] && competition.broadcasts[0].names) ? competition.broadcasts[0].names.join(', ') : 'No especificada';

            const goals = (isSoccer && state !== 'pre') ? extractGoalscorers(competition, true) : { home: '', away: '' };

            document.getElementById('widget-title').innerText = "DETALLE DEL ENCUENTRO";
            document.getElementById('back-btn').style.display = 'inline-block';

            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class="detail-view">
                    <div class="detail-matchup">
                        <div class="detail-team">
                            <img class="detail-logo" src="${homeLogo}" alt="">
                            <div class="detail-team-name">${homeRank} ${homeName}</div>
                            <div class="detail-record">Balance: ${homeRecord}</div>
                        </div>
                        <div class="detail-center">
                            <div class="detail-score">${scoreDisplay}</div>
                            <div class="detail-status">${statusText}</div>
                        </div>
                        <div class="detail-team">
                            <img class="detail-logo" src="${awayLogo}" alt="">
                            <div class="detail-team-name">${awayName} ${awayRank}</div>
                            <div class="detail-record">Balance: ${awayRecord}</div>
                        </div>
                    </div>

                    ${(isSoccer && (goals.home || goals.away)) ? `
                        <div class="info-card">
                            <div class="info-label">Goleadores ⚽</div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px;">
                                <div style="width: 48%; text-align: left;">${goals.home || 'Sin goles'}</div>
                                <div style="width: 48%; text-align: right;">${goals.away || 'Sin goles'}</div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="detail-info-grid">
                        <div class="info-card">
                            <div class="info-label">Estadio / Sede</div>
                            <div class="info-value">${venueName}${venueCity}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Emisión TV / Stream</div>
                            <div class="info-value">${broadcast}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function backToList() {
            loadESPNData();
        }

        loadESPNData();
        setInterval(loadESPNData, 60000);
    </script>
</body>
</html>
