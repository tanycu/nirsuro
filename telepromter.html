<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Teleprompter Pro - Inicio Central</title>
    <style>
        :root {
            --text-size: 55px;
            --line-height: 1.5;
        }

        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: 'Arial', sans-serif; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Guía traslúcida central ajustada al tamaño del texto */
        #reading-guide {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            height: calc(var(--text-size) * var(--line-height));
            background: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
        }

        #scroll-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #text-content {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: var(--text-size);
            line-height: var(--line-height);
            font-weight: bold;
            padding: 0 10%;
            white-space: pre-wrap;
            box-sizing: border-box;
            color: #ffffff;
            will-change: transform;
        }

        /* Panel de controles */
        #ui { 
            background: #111; 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            border-top: 2px solid #333;
            z-index: 20;
        }

        button { padding: 12px 20px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; transition: 0.2s; }
        #playBtn { background: #27ae60; color: white; }
        #recBtn { background: #c0392b; color: white; }
        input[type="range"] { width: 150px; cursor: pointer; }
        label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="reading-guide"></div>

    <div id="scroll-container">
        <div id="text-content">Carga un archivo .txt para comenzar...</div>
    </div>

    <div id="ui">
        <input type="file" id="fileInput" accept=".txt">
        
        <label>Velocidad:</label>
        <input type="range" id="speedSlider" min="0.1" max="6" step="0.1" value="1.5">
        
        <button id="playBtn">▶️ Iniciar</button>
        <button id="recBtn">🎙️ Grabar Audio</button>
    </div>

<script>
    const textContent = document.getElementById('text-content');
    const speedSlider = document.getElementById('speedSlider');
    const playBtn = document.getElementById('playBtn');
    const recBtn = document.getElementById('recBtn');
    const fileInput = document.getElementById('fileInput');

    let yPos = 0;
    let speed = 1.5;
    let paused = true;
    let mediaRecorder;
    let chunks = [];

    // Función para alinear la primera línea en el centro de la guía
    function alignFirstLine() {
        const screenCenter = window.innerHeight / 2;
        const fontSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--text-size'));
        const lineHeight = 1.5;
        // Ajustamos para que la primera línea quede dentro de la franja
        yPos = screenCenter - (fontSize * lineHeight / 2);
        textContent.style.transform = `translateY(${yPos}px)`;
    }

    fileInput.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            textContent.innerText = ev.target.result;
            alignFirstLine();
        };
        reader.readAsText(e.target.files[0]);
    };

    speedSlider.oninput = e => speed = parseFloat(e.target.value);
    
    playBtn.onclick = () => {
        paused = !paused;
        playBtn.innerText = paused ? "▶️ Reanudar" : "⏸️ Pausar";
        playBtn.style.background = paused ? "#27ae60" : "#d35400";
    };

    // Animación de bajada suave
    function animate() {
        if (!paused) {
            yPos += speed; // El texto baja
            textContent.style.transform = `translateY(${yPos}px)`;
        }
        
        // Detener si el texto ya pasó todo
        if (yPos > window.innerHeight + 100) {
            paused = true;
            playBtn.innerText = "▶️ Iniciar";
        }

        requestAnimationFrame(animate);
    }
    animate();

    // Grabación de Audio compatible con DaVinci
    recBtn.onclick = async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        sampleRate: 48000 // Frecuencia estándar para video pro
                    } 
                });
                
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `grabacion_pro.wav`;
                    a.click();
                    chunks = [];
                };

                mediaRecorder.start();
                recBtn.innerText = "⏹️ Detener";
                recBtn.style.background = "#555";
            } catch (err) {
                alert("Error: Activa el micrófono para grabar.");
            }
        } else {
            mediaRecorder.stop();
            recBtn.innerText = "🎙️ Grabar Audio";
            recBtn.style.background = "#c0392b";
        }
    };
</script>

</body>
</html>
